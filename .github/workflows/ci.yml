# Continuous integration for AJ Apartelle (SRS NFR-26).
# Runs on pushes to main and on pull requests from any branch. No path filters, so every
# job reports on every change and can be made a required check for merges into main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests + Testcontainers integration tests. Docker is available on ubuntu-latest,
      # so the tests start their own PostgreSQL 16 container. CI never connects to Supabase.
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history
      # Free gitleaks CLI from the official GitHub release (not the licensed GitHub Action).
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full git history
        run: gitleaks git --redact --verbose --exit-code 1 .

  build-artifacts:
    name: build-artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package backend JAR (tests already passed in the backend job)
        run: ./mvnw -B -DskipTests package
      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: ajapartelle-backend-jar
          path: backend/target/ajapartelle-*.jar
          if-no-files-found: error

