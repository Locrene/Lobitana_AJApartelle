spring.application.name=ajapartelle
# Load secrets from backend/.env (gitignored). Copy .env.example to .env first.
spring.config.import=optional:file:.env[.properties]

# Business time zone (FR-003, FR-055). Timestamps are stored as TIMESTAMPTZ;
# JSON dates are written in Asia/Manila time.
app.timezone=Asia/Manila
spring.jackson.time-zone=Asia/Manila
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Manila

# API documentation (NFR-18): Swagger UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ajapartelle}
spring.datasource.username=${DB_USERNAME:ajapartelle}
spring.datasource.password=${DB_PASSWORD}

# Schema is managed only by Flyway migrations (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JWT (SRS FR-042: token expires after 8 hours)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cookie.name=AJ_TOKEN
app.cookie.secure=${COOKIE_SECURE:false}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Password reset email over Gmail SMTP (FR-074, SRS D-08)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# First OWNER account (SRS FR-043), created at startup only if no OWNER exists
app.owner.email=${OWNER_EMAIL:}
app.owner.password=${OWNER_PASSWORD:}
app.owner.full-name=${OWNER_FULL_NAME:AJ Apartelle Owner}
app.owner.mobile=${OWNER_MOBILE:}
